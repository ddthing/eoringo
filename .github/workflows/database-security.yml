name: Database security tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database from migrations
        run: supabase db reset --local --yes

      - name: Run pgTAP database tests
        run: pnpm run test:db
